<!DOCTYPE html>
<html>
<head>
    <title>Movie/Series Recommender</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Movie/Series Recommender</h1>
    <form method="POST">
        <label for="title">Enter a Movie or Series Title:</label><br>
        <input type="text" name="title" required><br>

        <label for="media_type">Select Media Type:</label><br>
        <select name="media_type">
            <option value="movie">Movie</option>
            <option value="tv">TV Series</option>
        </select><br>

        <input type="submit" value="Get Recommendations">
    </form>

    {% if recommendations %}
        <h2 style="text-align: center;">Recommendations:</h2>
        {% for rec in recommendations %}
            <div class="recommendation clearfix">
                <img src="https://image.tmdb.org/t/p/w200{{ rec.poster_path }}" alt="{{ rec.title }} poster">
                <h3>{{ rec.title }}</h3>
                <p>{{ rec.overview }}</p>
                <em>Available on: {{ rec.platforms }}</em>
            </div>
        {% endfor %}
    {% endif %}
</body>
</html>
